<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ilumo">
  <!--
    One-colour mark for print, stamps, and anywhere colour is unavailable.

    The capsule becomes negative space rather than a second tone, so the shape
    survives a fax, a photocopy, and an embroidery machine. `currentColor` means
    it inherits from whatever it sits inside.
  -->
  <mask id="ilumo-mono-cut">
    <rect x="6" y="6" width="52" height="52" rx="15" fill="#FFFFFF"/>
    <rect x="9" y="23" width="46" height="18" rx="9" fill="#000000" transform="rotate(45 32 32)"/>
  </mask>
  <rect x="6" y="6" width="52" height="52" rx="15" fill="currentColor" mask="url(#ilumo-mono-cut)"/>
</svg>
