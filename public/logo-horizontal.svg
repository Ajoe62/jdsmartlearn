<svg width="320" height="64" viewBox="0 0 320 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JDSmartLearn AI">
  <!--
    Header lockup: icon + wordmark + AI tag.
    The AI tag is brass - the same accent as the spark - so "AI" reads as the
    smart layer, not a bolt-on. NOTE: wordmark uses a system font stack; convert
    text to OUTLINES in a vector editor before production use.
  -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0E5A3C"/>
  <rect x="19" y="16" width="24" height="32" rx="4" fill="#FFFFFF"/>
  <rect x="24" y="24" width="14" height="2.6" rx="1.3" fill="#0E5A3C"/>
  <rect x="24" y="30" width="14" height="2.6" rx="1.3" fill="#0E5A3C"/>
  <rect x="24" y="36" width="9"  height="2.6" rx="1.3" fill="#0E5A3C"/>
  <path d="M45 10 L46.84 15.16 L52 17 L46.84 18.84 L45 24 L43.16 18.84 L38 17 L43.16 15.16 Z" fill="#C88A1C"/>

  <text x="78" y="41"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="27" font-weight="700" letter-spacing="-0.6">
    <tspan fill="#0E5A3C">JD</tspan><tspan fill="#15221C">SmartLearn</tspan>
  </text>

  <!-- AI tag -->
  <rect x="262" y="15" width="34" height="22" rx="6" fill="#FAF0D8"/>
  <text x="279" y="31" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="14" font-weight="700" letter-spacing="0.5" fill="#9C6A11">AI</text>
</svg>
