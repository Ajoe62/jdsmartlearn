<svg width="512" height="512" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JDSmartLearn">
  <!--
    Install / app icon, declared `maskable` in the manifest.

    Android crops a maskable icon to an arbitrary shape and may take up to 20%
    off each edge, so the background is full-bleed and the mark is scaled to ~60%
    of the tile - inside the safe circle whatever mask a launcher applies.
  -->
  <rect width="64" height="64" fill="#FFFFFF"/>
  <defs>
    <clipPath id="ilumo-icon-lower-right">
      <path d="M64 0 L64 64 L0 64 Z"/>
    </clipPath>
  </defs>
  <g transform="translate(8.6 8.6) scale(0.731)">
    <rect x="6" y="6" width="52" height="52" rx="15" fill="#5FE9B2"/>
    <g clip-path="url(#ilumo-icon-lower-right)">
      <rect x="6" y="6" width="52" height="52" rx="15" fill="#3E9BFF"/>
    </g>
    <rect x="9" y="23" width="46" height="18" rx="9" fill="#3852D6" transform="rotate(45 32 32)"/>
  </g>
</svg>
