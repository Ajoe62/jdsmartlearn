<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ilumo">
  <!--
    The ilumo mark. Normative geometry - docs/ilumo-brand.md section 2.

    A rounded square split on the "/" diagonal (mint upper-left, azure
    lower-right) crossed by an indigo capsule on the "\" diagonal. The capsule is
    where the two halves intersect, which is also why indigo carries primary
    actions in the palette.

    No <text> in this file, and none in any other logo file: an SVG font-family
    stack substitutes a different font on every device.
  -->
  <defs>
    <clipPath id="ilumo-lower-right">
      <path d="M64 0 L64 64 L0 64 Z"/>
    </clipPath>
  </defs>

  <rect x="6" y="6" width="52" height="52" rx="15" fill="#5FE9B2"/>
  <g clip-path="url(#ilumo-lower-right)">
    <rect x="6" y="6" width="52" height="52" rx="15" fill="#3E9BFF"/>
  </g>
  <rect x="9" y="23" width="46" height="18" rx="9" fill="#3852D6" transform="rotate(45 32 32)"/>
</svg>
