<svg width="32" height="32" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JDSmartLearn">
  <!--
    The tab icon. This file, not public/favicon.svg, is what Next serves - the
    App Router icon convention generates the <link rel="icon"> from it.

    Same geometry as public/logo-mark.svg with the clear space removed, so the
    shape fills the tile and the diagonal split still reads at 16px.
  -->
  <defs>
    <clipPath id="ilumo-icon-lr">
      <path d="M64 0 L64 64 L0 64 Z"/>
    </clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="#5FE9B2"/>
  <g clip-path="url(#ilumo-icon-lr)">
    <rect x="2" y="2" width="60" height="60" rx="17" fill="#3E9BFF"/>
  </g>
  <rect x="5" y="21.5" width="54" height="21" rx="10.5" fill="#3852D6" transform="rotate(45 32 32)"/>
</svg>
